<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عروض وإعلانات المحل - Aparze.Net</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ffcc00;
            --accent-hover: #e6b800;
            --text-color: #ffffff;
            --text-secondary: #aaa;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--accent-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        nav a:hover, nav a.active {
            background-color: var(--accent-color);
            color: #000;
        }

        main {
            flex: 1;
            padding: 30px 15px;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .page-title {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 30px;
        }

        .ads-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .ad-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .ad-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .ad-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background-color: #222;
        }

        .ad-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .ad-title {
            color: var(--accent-color);
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }

        .ad-desc {
            color: var(--text-color);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 15px;
            flex: 1;
        }

        /* تنسيق زر الـ لينك تحت الصورة */
        .ad-btn {
            display: block;
            background-color: var(--accent-color);
            color: #000;
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background-color 0.3s ease;
            margin-top: auto;
        }

        .ad-btn:hover {
            background-color: var(--accent-hover);
        }

        footer {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 15px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: auto;
        }

        @media (max-width: 480px) {
            header {
                justify-content: center;
                text-align: center;
            }
            nav {
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">⚡ Aparze.Net</a>
        <nav>
            <a href="index.html">الرئيسية</a>
            <a href="programs.html">قسم البرامج</a>
            <a href="ads.html" class="active">عروض المحل</a>
            <a href="about.html">عن الموقع والاتصال</a>
        </nav>
    </header>

    <main>
        <h1 class="page-title">📢 أحدث العروض والخدمات المتاحة</h1>
        <div class="ads-grid" id="adsContainer">
            <!-- سيتم تحميل الإعلانات تلقائياً هنا -->
        </div>
    </main>

    <footer>
        &copy; 2026 جميع الحقوق محفوظة | (Aparze Net) ابرازي نت
    </footer>

    <script>
        // قراءة الإعلانات والروابط من ملف ads.json وتوليدها تلقائياً
        fetch('ads.json')
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('adsContainer');
                container.innerHTML = '';

                data.forEach(ad => {
                    const card = document.createElement('div');
                    card.className = 'ad-card';

                    card.innerHTML = `
                        ${ad.image ? `<img src="${ad.image}" alt="${ad.title}" class="ad-image">` : ''}
                        <div class="ad-content">
                            <h3 class="ad-title">${ad.title}</h3>
                            <p class="ad-desc">${ad.description}</p>
                            ${ad.linkUrl ? `<a href="${ad.linkUrl}" target="_blank" class="ad-btn">${ad.linkText || 'رابط العرض'}</a>` : ''}
                        </div>
                    `;

                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error('خطأ في تحميل العروض:', error);
            });
    </script>
</body>
</html>
