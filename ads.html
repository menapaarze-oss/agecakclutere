<script>
    fetch('ads.json')
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('adsContainer');
            container.innerHTML = '';

            data.forEach(ad => {
                const card = document.createElement('div');
                card.className = 'ad-card';

                // دعم المسميات الجديدة والقديمة وتأمين الروابط
                const downloadUrl = ad.downloadUrl || '';
                const whatsappUrl = ad.whatsappUrl || ad.linkUrl || '';

                card.innerHTML = `
                    ${ad.image ? `<img src="${ad.image}" alt="${ad.title}" class="ad-image" onerror="this.style.display='none'">` : ''}
                    <div class="ad-content">
                        <h2 class="ad-title">${ad.title}</h2>
                        <p class="ad-desc">${ad.description}</p>
                        <div class="buttons-group">
                            ${downloadUrl ? `<a href="\${downloadUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-download">🎮 تحميل اللعبة الآن</a>` : ''}
                            ${whatsappUrl ? `<a href="\${whatsappUrl}" target="_blank" rel="noopener noreferrer" class="btn btn-whatsapp">📲 تواصل عبر الواتساب</a>` : ''}
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });
        })
        .catch(error => {
            console.error('خطأ في جلب بيانات الإعلانات:', error);
        });
</script>
