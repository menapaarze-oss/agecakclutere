<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة العمر - Aparze.Net</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #ffcc00;
            --accent-hover: #e6b800;
            --text-color: #ffffff;
            --text-secondary: #aaa;
            --border-color: #333333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 2px solid var(--accent-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 5px;
            transition: all 0.3s ease;
        }

        nav a:hover, nav a.active {
            background-color: var(--accent-color);
            color: #000;
        }

        main {
            flex: 1;
            padding: 30px 15px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .calculator-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .calc-title {
            text-align: center;
            color: var(--accent-color);
            margin-top: 0;
            font-size: 1.4rem;
        }

        .calc-subtitle {
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .inputs-row {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            direction: ltr;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            max-width: 100px;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            background-color: #2a2a2a;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            color: #fff;
            text-align: center;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .btn-calc {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-calc:hover {
            background-color: var(--accent-hover);
        }

        .section-label {
            color: var(--accent-color);
            font-weight: bold;
            margin-bottom: 8px;
            text-align: right;
        }

        footer {
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            text-align: center;
            padding: 15px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-top: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            align-items: center;
        }

        footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            header {
                justify-content: center;
                text-align: center;
            }
            nav {
                justify-content: center;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">⚡ Aparze.Net</a>
        <nav>
            <a href="index.html" class="active">الرئيسية</a>
            <a href="programs.html">قسم البرامج</a>
            <a href="ads.html">عروض ابرزى نت</a>
            <a href="about.html">عن الموقع والاتصال</a>
        </nav>
    </header>

    <main>
        <!-- حاسبة العمر -->
        <div class="calculator-card">
            <h2 class="calc-title">🎂 حاسبة العمر</h2>
            <p class="calc-subtitle">اكتب تاريخ ميلادك ثم اضغط احسب</p>
            <div class="inputs-row">
                <div class="input-group">
                    <label>سنة</label>
                    <input type="number" placeholder="YYYY">
                </div>
                <div class="input-group">
                    <label>شهر</label>
                    <input type="number" placeholder="MM">
                </div>
                <div class="input-group">
                    <label>يوم</label>
                    <input type="number" placeholder="DD">
                </div>
            </div>
            <button class="btn-calc">🎯 احسب العمر</button>
        </div>

        <!-- حاسبة فرق العمر -->
        <div class="calculator-card">
            <h2 class="calc-title">⚖️ حاسبة فرق العمر</h2>
            <p class="calc-subtitle">أدخل تاريخ ميلاد الفردين لمعرفة الفرق بينهما</p>
            
            <div class="section-label">👤 الشخص الأول:</div>
            <div class="inputs-row">
                <div class="input-group">
                    <label>سنة</label>
                    <input type="number" placeholder="YYYY">
                </div>
                <div class="input-group">
                    <label>شهر</label>
                    <input type="number" placeholder="MM">
                </div>
                <div class="input-group">
                    <label>يوم</label>
                    <input type="number" placeholder="DD">
                </div>
            </div>

            <div class="section-label">👤 الشخص الثاني:</div>
            <div class="inputs-row">
                <div class="input-group">
                    <label>سنة</label>
                    <input type="number" placeholder="YYYY">
                </div>
                <div class="input-group">
                    <label>شهر</label>
                    <input type="number" placeholder="MM">
                </div>
                <div class="input-group">
                    <label>يوم</label>
                    <input type="number" placeholder="DD">
                </div>
            </div>

            <button class="btn-calc">🎯 احسب فرق العمر</button>
        </div>
    </main>

    <!-- الـ Footer المحدث مع رابط شروط الاستخدام واسم ابرزى نت الصحيح -->
    <footer>
        <div>&copy; 2026 جميع الحقوق محفوظة | (Aparze Net) ابرزى نت</div>
        <div><a href="terms.html">📌 شروط الاستخدام وسياسة الموقع</a></div>
    </footer>

</body>
</html>
