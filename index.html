<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حاسبة العمر - Aparze.Net</title>
  <!-- مكتبة الاحتفال بالبالونات -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #007bff;
      --text-color: #ffffff;
      --border-color: #333333;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }
    header {
      text-align: center;
      padding: 15px 0;
      border-bottom: 1px solid var(--border-color);
      margin-bottom: 25px;
    }
    nav a {
      color: #aaa;
      text-decoration: none;
      margin: 0 10px;
      font-weight: bold;
    }
    nav a:hover, nav a.active {
      color: var(--accent-color);
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    h2 {
      text-align: center;
      color: var(--accent-color);
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="date"] {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #2a2a2a;
      color: #fff;
      box-sizing: border-box;
    }
    button {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover {
      background: #0056b3;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      background: #252525;
      border-radius: 8px;
      border-right: 4px solid var(--accent-color);
    }
    .result p {
      margin: 8px 0;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Aparze.Net</h1>
    <nav>
      <a href="index.html" class="active">حاسبة العمر</a>
      <a href="programs.html">البرامج المجانية</a>
      <a href="paid-programs.html">البرامج المدفوعة</a>
    </nav>
  </header>

  <div class="container">
    <h2>حساب العمر الدقيق</h2>
    <div class="form-group">
      <label for="birthdate">تاريخ الميلاد:</label>
      <input type="date" id="birthdate">
    </div>
    <button onclick="calculateAge()">احسب العمر</button>

    <div class="result" id="resultBox" style="display: none;">
      <p><strong>العمر التفصيلي:</strong> <span id="ageText"></span></p>
      <p><strong>إجمالي الأيام:</strong> <span id="totalDaysText"></span> يوم</p>
      <p><strong>الفرق لعيد الميلاد القادم:</strong> <span id="diffDaysText"></span></p>
    </div>
  </div>

  <script>
    function calculateAge() {
      const birthdateInput = document.getElementById('birthdate').value;
      if (!birthdateInput) {
        alert('الرجاء إدخال تاريخ الميلاد!');
        return;
      }

      const birthDate = new Date(birthdateInput);
      const today = new Date();

      if (birthDate > today) {
        alert('تاريخ الميلاد لا يمكن أن يكون في المستقبل!');
        return;
      }

      // حساب السنوات والأشهر والأيام
      let years = today.getFullYear() - birthDate.getFullYear();
      let months = today.getMonth() - birthDate.getMonth();
      let days = today.getDate() - birthDate.getDate();

      if (days < 0) {
        months--;
        const prevMonth = new Date(today.getFullYear(), today.getMonth(), 0);
        days += prevMonth.getDate();
      }

      if (months < 0) {
        years--;
        months += 12;
      }

      // حساب إجمالي الأيام
      const diffTime = Math.abs(today - birthDate);
      const totalDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

      // حساب الأيام المتبقية لعيد الميلاد القادم
      let nextBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
      if (nextBirthday < today) {
        nextBirthday.setFullYear(today.getFullYear() + 1);
      }
      const diffNextBirthday = Math.ceil((nextBirthday - today) / (1000 * 60 * 60 * 24));

      // عرض النتائج في العناصر
      document.getElementById('ageText').innerText = `${years} سنة و ${months} شهر و ${days} يوم`;
      document.getElementById('totalDaysText').innerText = totalDays.toLocaleString('ar-EG');
      document.getElementById('diffDaysText').innerText = `${diffNextBirthday} يوم متبقي لعيد ميلادك القادم`;
      
      document.getElementById('resultBox').style.display = 'block';

      // إطلاق البالونات عند الحساب الناجح
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }
  </script>

</body>
</html>
