<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حاسبة العمر وفرق العمر</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 30px 0;
        }
        .container {
            background-color: #1a1a1a;
            padding: 25px;
            border-radius: 10px;
            border: 2px solid #ffcc00;
            text-align: center;
            width: 380px;
            margin-bottom: 25px;
        }
        h2 {
            color: #ffcc00;
            margin-top: 0;
        }
        .section-title {
            color: #ffcc00;
            font-size: 14px;
            font-weight: bold;
            margin: 15px 0 5px 0;
            text-align: right;
        }
        .inputs {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            width: 30%;
        }
        label {
            color: #aaa;
            margin-bottom: 5px;
            font-size: 13px;
        }
        input {
            background-color: #222;
            border: 2px solid #ffcc00;
            color: #ffcc00;
            padding: 8px;
            text-align: center;
            font-size: 16px;
            border-radius: 5px;
            outline: none;
        }
        .btn-calculate {
            background-color: #ffcc00;
            color: #000;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 15px;
        }
        .btn-calculate:hover {
            background-color: #e6b800;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            border: 2px solid #ffcc00;
            border-radius: 5px;
            background-color: #111;
        }
        .results {
            font-size: 18px;
            color: #00ffcc;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. القسم الأول: حاسبة العمر الفردية -->
    <div class="container">
        <h2>🎂 حاسبة العمر</h2>
        <p style="font-size: 12px; color: #aaa;">اكتب تاريخ ميلادك ثم اضغط احسب</p>
        
        <div class="inputs">
            <div class="input-group">
                <label>اليوم</label>
                <input type="number" id="day1" placeholder="DD" min="1" max="31">
            </div>
            <div class="input-group">
                <label>الشهر</label>
                <input type="number" id="month1" placeholder="MM" min="1" max="12">
            </div>
            <div class="input-group">
                <label>السنة</label>
                <input type="number" id="year1" placeholder="YYYY" min="1900" max="2026">
            </div>
        </div>

        <button class="btn-calculate" onclick="calculateAge()">احسب العمر 🎯</button>

        <div class="result-box" id="resultBox1" style="display:none;">
            <div class="results" id="resultText1"></div>
            <p id="totalDays1" style="color: #ffcc00; margin-top: 10px; font-size: 14px;"></p>
        </div>
    </div>


    <!-- 2. القسم الثاني: حاسبة فرق العمر بين شخصين -->
    <div class="container">
        <h2>⚖️ حاسبة فرق العمر</h2>
        <p style="font-size: 12px; color: #aaa;">أدخل تاريخ ميلاد الفردين لمعرفة الفرق بينهما</p>
        
        <div class="section-title">👤 الشخص الأول:</div>
        <div class="inputs">
            <div class="input-group">
                <label>اليوم</label>
                <input type="number" id="dayA" placeholder="DD" min="1" max="31">
            </div>
            <div class="input-group">
                <label>الشهر</label>
                <input type="number" id="monthA" placeholder="MM" min="1" max="12">
            </div>
            <div class="input-group">
                <label>السنة</label>
                <input type="number" id="yearA" placeholder="YYYY" min="1900" max="2026">
            </div>
        </div>

        <div class="section-title">👤 الشخص الثاني:</div>
        <div class="inputs">
            <div class="input-group">
                <label>اليوم</label>
                <input type="number" id="dayB" placeholder="DD" min="1" max="31">
            </div>
            <div class="input-group">
                <label>الشهر</label>
                <input type="number" id="monthB" placeholder="MM" min="1" max="12">
            </div>
            <div class="input-group">
                <label>السنة</label>
                <input type="number" id="yearB" placeholder="YYYY" min="1900" max="2026">
            </div>
        </div>

        <button class="btn-calculate" onclick="calculateAgeDiff()">احسب فرق العمر 🎯</button>

        <div class="result-box" id="resultBox2" style="display:none;">
            <p style="color: #aaa; margin: 0 0 5px 0; font-size: 13px;">فرق العمر هو:</p>
            <div class="results" id="resultText2"></div>
            <p id="totalDays2" style="color: #ffcc00; margin-top: 10px; font-size: 14px; font-weight: bold;"></p>
        </div>
    </div>

    <script>
        // دالة حاسبة العمر الفردية
        function calculateAge() {
            const d = parseInt(document.getElementById('day1').value);
            const m = parseInt(document.getElementById('month1').value) - 1;
            const y = parseInt(document.getElementById('year1').value);

            if (isNaN(d) || isNaN(m) || isNaN(y)) {
                alert('الرجاء إدخال تاريخ الميلاد بشكل صحيح');
                return;
            }

            const birthDate = new Date(y, m, d);
            const today = new Date();

            let years = today.getFullYear() - birthDate.getFullYear();
            let months = today.getMonth() - birthDate.getMonth();
            let days = today.getDate() - birthDate.getDate();

            if (days < 0) {
                months--;
                const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                days += lastMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            const diffTime = Math.abs(today - birthDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            document.getElementById('resultBox1').style.display = 'block';
            document.getElementById('resultText1').innerText = `${years} سنة | ${months} شهر | ${days} يوم`;
            document.getElementById('totalDays1').innerText = `إجمالي الأيام: ${diffDays.toLocaleString()} يوم`;
        }

        // دالة حاسبة فرق العمر بين شخصين
        function calculateAgeDiff() {
            const d1 = parseInt(document.getElementById('dayA').value);
            const m1 = parseInt(document.getElementById('monthA').value) - 1;
            const y1 = parseInt(document.getElementById('yearA').value);

            const d2 = parseInt(document.getElementById('dayB').value);
            const m2 = parseInt(document.getElementById('monthB').value) - 1;
            const y2 = parseInt(document.getElementById('yearB').value);

            if (isNaN(d1) || isNaN(m1) || isNaN(y1) || isNaN(d2) || isNaN(m2) || isNaN(y2)) {
                alert('الرجاء إدخال تواريخ الشخصين بشكل صحيح');
                return;
            }

            let date1 = new Date(y1, m1, d1);
            let date2 = new Date(y2, m2, d2);

            let olderDate = date1 < date2 ? date1 : date2;
            let youngerDate = date1 < date2 ? date2 : date1;

            let years = youngerDate.getFullYear() - olderDate.getFullYear();
            let months = youngerDate.getMonth() - olderDate.getMonth();
            let days = youngerDate.getDate() - olderDate.getDate();

            if (days < 0) {
                months--;
                const lastMonth = new Date(youngerDate.getFullYear(), youngerDate.getMonth(), 0);
                days += lastMonth.getDate();
            }

            if (months < 0) {
                years--;
                months += 12;
            }

            const diffTime = Math.abs(youngerDate - olderDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

            document.getElementById('resultBox2').style.display = 'block';
            document.getElementById('resultText2').innerText = `${years} سنة | ${months} شهر | ${days} يوم`;
            document.getElementById('totalDays2').innerText = `إجمالي الفرق بالأيام: ${diffDays.toLocaleString()} يوم`;
        }
    </script>
</body>
</html>
